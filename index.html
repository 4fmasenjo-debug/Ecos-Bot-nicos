<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detección de Manos - Grulla</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Efecto espejo */
      transform: scaleX(-1);
    }
    video {
      display: none;
    }
    canvas {
      display: block;
    }
    /* ------------------------------------------
       BOTÓN DE INICIO
       ------------------------------------------ */

    #startButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      padding: 18px 36px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      font-size: 20px;
      cursor: pointer;
      transition:
        opacity 0.3s ease,
        transform 0.2s ease;
    }
    #startButton:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
    #startButton:active {
      transform: translate(-50%, -50%) scale(0.98);
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 90;
      display: none;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ==========================================
       VÍDEO DE LA CÁMARA
       ========================================== -->

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>
  <canvas id="canvas"></canvas>

  <!-- ==========================================
       MÚSICA
       ========================================== -->

  <audio
    id="music"
    src="Debussy - Arabesque No. 1 (Ciccolini) [Yh36PaE-Pf0].mp3"
    loop>
  </audio>

  <!-- ==========================================
       BOTÓN DE INICIO Y TEXTO DE CARGA
       ========================================== -->

  <button id="startButton">
    Pulsar
  </button>
  <div id="loading">
    Cargando...
  </div>

  <!-- ==========================================
       TENSORFLOW
       ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0"></script>

  <!-- ==========================================
       MEDIAPIPE HANDS
       ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>

  <!-- ==========================================
       HAND POSE DETECTION
       ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>

  <!-- ==========================================
       SCRIPT
       ========================================== -->

  <script src="soloManos.js"></script> 
</body>
</html>
